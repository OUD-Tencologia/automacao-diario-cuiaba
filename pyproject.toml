[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automacao-editorial-diario-cuiaba"
version = "0.1.0"
description = "Automation API do MVP editorial do Diário Cuiabá"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "playwright>=1.55,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "sumy>=0.11,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "apps/automation_api/src"}

[tool.setuptools.packages.find]
where = ["apps/automation_api/src"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
